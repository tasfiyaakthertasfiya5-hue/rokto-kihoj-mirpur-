<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rokto Khoj Mirpur</title>
<style>
body{font-family:Arial;background:#fff5f5;margin:0;padding:15px}
header{background:#d32f2f;color:white;padding:15px;text-align:center;border-radius:10px}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px #ccc}
button{background:#d32f2f;color:white;border:none;padding:8px 15px;border-radius:5px;margin:2px}
select,input{padding:8px;margin:5px;width:90%;border-radius:5px;border:1px solid #ccc}
</style>
</head>
<body>
<header><h2>🩸 Rokto Khoj Mirpur</h2><p>Mirpur er rokto data ekhane</p></header>

<div class="card">
<h3>Find Donor</h3>
<select id="bloodFilter"><option value="All">All Blood</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select>
<select id="areaFilter"><option value="All">All Area</option><option>Mirpur 1</option><option>Mirpur 2</option><option>Mirpur 10</option><option>Mirpur 11</option><option>Mirpur 12</option></select>
<button onclick="searchDonor()">Search</button>
</div>

<div id="donorList">Loading donors...</div>

<div class="card">
<h3>Become a Donor - Add Yourself</h3>
<p>Tomar permission chara nije add hote parbe!</p>
<input id="name" placeholder="Tomar Naam - Sumaiya islam">
<input id="phone" placeholder="Phone - 01626300699">
<select id="blood"><option>O+</option><option>A+</option><option>B+</option><option>AB+</option><option>A-</option><option>B-</option><option>O-</option><option>AB-</option></select>
<select id="area"><option>Mirpur 12</option><option>Mirpur 10</option><option>Mirpur 11</option><option>Mirpur 1</option><option>Mirpur 2</option></select>
<button onclick="addDonor()">Add Me as Donor</button>
<p style="font-size:12px;color:gray">Add korle sathe sathe sobai dekhte parbe!</p>
</div>

<p style="text-align:center">Built by Jann ❤️</p>

<div class="card" style="text-align:center">
<h4>Help - Nagad</h4>
<p>Support er jonno: 01749902775</p>
<a href="https://wa.me/8801749902775"><button style="background:#25D366">WhatsApp e Help</button></a>
</div>

<script>
const SHEET_LINK = "https://script.google.com/macros/s/TOMAR_LINK_EKHANE_BOSAO/exec";

let donors = [];
function showDonors(list){
  let html="";
  list.forEach(d=>{
    html+=`<div class="card"><h3>${d.name} - ${d.blood}</h3><p>📍 ${d.area}</p><p><a href="tel:${d.phone}"><button>📞 Call</button></a> <a href="https://wa.me/88${d.phone}"><button style="background:#25D366">WhatsApp</button></a></p></div>`;
  });
  document.getElementById('donorList').innerHTML = html || "<p>Kono donor nai</p>";
}
function searchDonor(){
  let b=document.getElementById('bloodFilter').value;
  let a=document.getElementById('areaFilter').value;
  let f=donors.filter(d=>(b=="All"||d.blood==b)&&(a=="All"||d.area==a));
  showDonors(f);
}
function loadDonors(){
  fetch(SHEET_LINK).then(r=>r.json()).then(data=>{donors=data; showDonors(donors);});
}
loadDonors();

function addDonor(){
  let n=document.getElementById('name').value;
  let p=document.getElementById('phone').value;
  let b=document.getElementById('blood').value;
  let ar=document.getElementById('area').value;
  if(n==""||p==""){alert("Naam ar Phone dao!");return;}
  let newDonor={name:n,blood:b,area:ar,phone:p};
  document.getElementById('donorList').innerHTML = "Adding...";
  fetch(SHEET_LINK, {method:"POST", mode:"no-cors", body:JSON.stringify(newDonor)}).then(()=>{
    donors.unshift(newDonor); showDonors(donors);
    alert("Done! Ekhon tumi + sob visitor dekhte parbe!");
  });
}
</script>

</body>
</html>
